<meta charset="utf-8">
<title>__TITLE__</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* 版式：顶部说明 + 图例/工具条；主体是从左向右展开、每个节点带真实截图缩略图的逻辑脑图（独立滚动画布）；
   点图打开详情面板（桌面在右、手机在底），可逐个切换场景、放大细节、自动导览 */
:root {
  --bg: #eceff1; --surface: #f8f9fa; --sunk: #e3e7ea; --fg: #1a1f23; --muted: #5b656d; --line: #b9c1c7;
  --root: #1f2529; --root-fg: #f3f5f6; --shadow: rgba(24, 32, 38, .14); --hit: #ffe07a;
  --c1: #12807a; --c2: #3d57c9; --c3: #b9562a; --c4: #61761a; --c5: #9c6c0e; --c6: #8a3f8f;
  --ok: #23804f; --ok-bg: #dcefe3; --pv: #4d6170; --pv-bg: #dfe6eb; --cs: #a2471f; --cs-bg: #f6e1d6;
  --br: #5a4bb0; --br-bg: #e6e2f6; --td: #b03a3a; --td-bg: #f5dede; --sm: #86600f; --sm-bg: #f3e8cf;
  --font-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-display: "Noto Serif SC", "Songti SC", "STSong", serif;
  --font-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --ease: cubic-bezier(.2, .8, .2, 1);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14181b; --surface: #1d2226; --sunk: #262c31; --fg: #e5e9ec; --muted: #97a2ab; --line: #3b454c;
    --root: #e5e9ec; --root-fg: #14181b; --shadow: rgba(0, 0, 0, .45); --hit: #6b5a12;
    --c1: #4cc0b7; --c2: #8b9ef0; --c3: #ee9562; --c4: #a8c04e; --c5: #e0b04a; --c6: #d79ad9;
    --ok: #6fd39b; --ok-bg: #1d3a2a; --pv: #a9bccb; --pv-bg: #26323b; --cs: #f2a37a; --cs-bg: #43281b;
    --br: #b3a7f5; --br-bg: #2e2850; --td: #f09090; --td-bg: #452324; --sm: #e8c06a; --sm-bg: #3d3018;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14181b; --surface: #1d2226; --sunk: #262c31; --fg: #e5e9ec; --muted: #97a2ab; --line: #3b454c;
  --root: #e5e9ec; --root-fg: #14181b; --shadow: rgba(0, 0, 0, .45); --hit: #6b5a12;
  --c1: #4cc0b7; --c2: #8b9ef0; --c3: #ee9562; --c4: #a8c04e; --c5: #e0b04a; --c6: #d79ad9;
  --ok: #6fd39b; --ok-bg: #1d3a2a; --pv: #a9bccb; --pv-bg: #26323b; --cs: #f2a37a; --cs-bg: #43281b;
  --br: #b3a7f5; --br-bg: #2e2850; --td: #f09090; --td-bg: #452324; --sm: #e8c06a; --sm-bg: #3d3018;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 28px 40px; display: flex; flex-direction: column; gap: 18px;
}
header { display: flex; flex-direction: column; gap: 8px; max-width: 74ch; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-size: clamp(26px, 4.6vw, 38px); line-height: 1.2; margin: 0; text-wrap: balance; }
.lede { margin: 0; color: var(--muted); }
.lede b { color: var(--fg); font-weight: 500; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span.lab { font-size: 12px; color: var(--muted); margin-right: 2px; }
.chip, .btn, .vbtn {
  font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg);
  border-radius: 999px; padding: 4px 12px; cursor: pointer; transition: background .2s, border-color .2s, transform .15s var(--ease);
}
.chip:active, .btn:active, .vbtn:active { transform: scale(.95); }
.chip[aria-pressed="true"], .vbtn[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 6px; vertical-align: 1px; }
.btn:hover, .chip:hover, .vbtn:hover { border-color: var(--muted); }
.btn:focus-visible, .chip:focus-visible, .node:focus-visible, .th:focus-visible, input:focus-visible, .vbtn:focus-visible { outline: 2px solid var(--c2); outline-offset: 2px; }
#q { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 12px; width: 200px; max-width: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); align-items: center; }
.legend .b { margin-right: 4px; }
.b { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border-radius: 4px; font-weight: 500; white-space: nowrap; vertical-align: 1px; }
.b.ok, .kind.ok { color: var(--ok); background: var(--ok-bg); }
.b.pv, .kind.pv { color: var(--pv); background: var(--pv-bg); }
.b.cs, .kind.cs { color: var(--cs); background: var(--cs-bg); }
.b.br, .kind.br { color: var(--br); background: var(--br-bg); }
.b.td, .kind.td { color: var(--td); background: var(--td-bg); }
.b.sm, .kind.sm { color: var(--sm); background: var(--sm-bg); }

.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: auto; cursor: grab; max-height: 80vh; min-height: 420px; -webkit-overflow-scrolling: touch; }
.canvas.dragging { cursor: grabbing; user-select: none; }
.tree { padding: 28px 48px 28px 24px; width: max-content; }
.branch { display: flex; align-items: center; position: relative; }
.kids { display: flex; flex-direction: column; position: relative; margin-left: 28px; padding-block: 2px; }
.kids::before { content: ""; position: absolute; left: -28px; top: 50%; width: 28px; border-top: 1.5px solid var(--lc, var(--line)); transform-origin: left center; animation: draw .3s var(--ease) both; }
.kids > .branch { padding-left: 22px; padding-block: 4px; animation: grow .42s var(--ease) both; animation-delay: calc(var(--i, 0) * 32ms); }
.kids > .branch::before { content: ""; position: absolute; left: 0; top: 50%; width: 22px; border-top: 1.5px solid var(--lc, var(--line)); }
.kids > .branch::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; border-left: 1.5px solid var(--lc, var(--line)); }
.kids > .branch:first-child::after { top: 50%; }
.kids > .branch:last-child::after { bottom: 50%; }
.kids > .branch:only-child::after { display: none; }
.branch.collapsed > .kids { display: none; }
@keyframes grow { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.node { font: inherit; text-align: left; border: 0; background: none; color: inherit; padding: 0; display: flex; align-items: center; gap: 10px; position: relative; cursor: pointer; transition: transform .2s var(--ease), box-shadow .2s var(--ease); }
.node:hover { transform: translateY(-2px); }
.node .txt { display: block; min-width: 0; }
.node .t { display: block; }
.node .d { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.node .bs { display: inline-flex; gap: 4px; margin-left: 6px; flex-wrap: wrap; }
.node .fold { display: none; font-family: var(--font-mono); font-size: 11px; color: var(--c); margin-left: 6px; border: 1px solid currentColor; border-radius: 999px; padding: 0 6px; vertical-align: 1px; }
.branch.collapsed > .node .fold { display: inline-block; }
kbd, .k { font-family: var(--font-mono); font-size: 11.5px; padding: 0 4px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; background: var(--bg); color: var(--fg); white-space: nowrap; }
.th { flex: none; display: block; position: relative; overflow: hidden; border-radius: 7px; background: var(--sunk); border: 1px solid var(--line); padding: 0; cursor: zoom-in; width: 46px; height: 58px; transition: transform .25s var(--ease), box-shadow .25s var(--ease), border-color .2s; }
.th img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; }
.th.wide { width: 76px; height: 50px; }
.th.wide img { object-position: center; }
.th .tag { position: absolute; right: 3px; bottom: 3px; font-family: var(--font-mono); font-size: 8.5px; line-height: 1; padding: 2px 3px; border-radius: 3px; background: rgba(0, 0, 0, .62); color: #fff; letter-spacing: .04em; }
.node:hover .th, .th:focus-visible { transform: scale(1.08) rotate(-1deg); box-shadow: 0 6px 16px var(--shadow); border-color: var(--c); }
.lv0 > .node { flex-direction: column; align-items: stretch; gap: 0; background: var(--root); color: var(--root-fg); border-radius: 18px; overflow: hidden; width: 200px; box-shadow: 0 10px 28px var(--shadow); }
.lv0 > .node .th { width: 100%; height: 150px; border: 0; border-radius: 0; }
.lv0 > .node .th img { object-position: center 60%; }
.lv0 > .node .txt { padding: 10px 16px 14px; font-family: var(--font-display); font-size: 21px; line-height: 1.25; }
.lv0 > .node .d { color: inherit; opacity: .7; font-family: var(--font-body); font-size: 12px; margin-top: 4px; }
.lv0 > .node .fold, .lv1 > .node .fold { color: inherit; }
.lv1 > .node { background: var(--c); color: var(--surface); padding: 6px 14px 6px 6px; border-radius: 14px; font-weight: 700; font-size: 15px; max-width: 290px; }
.lv1 > .node .th { width: 54px; height: 66px; border-color: transparent; }
.lv1 > .node .th.wide { width: 86px; height: 58px; }
.lv1 > .node .d { color: inherit; opacity: .85; font-weight: 400; }
.lv1 > .node:hover, .lv2 > .node:hover { box-shadow: 0 6px 18px var(--shadow); }
.lv2 > .node { border: 1.5px solid var(--c); background: var(--surface); padding: 5px 12px 5px 5px; border-radius: 12px; font-weight: 500; max-width: 300px; }
.lv3 > .node, .lv4 > .node, .lv5 > .node { padding: 2px 6px 2px 0; max-width: 330px; border-radius: 8px; }
.lv3 > .node .th, .lv4 > .node .th, .lv5 > .node .th { width: 38px; height: 48px; }
.lv3 > .node .th.wide, .lv4 > .node .th.wide, .lv5 > .node .th.wide { width: 62px; height: 42px; }
.lv3 > .node.has-kids .t { font-weight: 500; }
.lv4 > .node, .lv5 > .node { font-size: 13px; }
.lv1, .lv1 .kids { --lc: color-mix(in srgb, var(--c) 45%, var(--line)); }
.node.current { animation: ring 1.6s var(--ease) infinite; }
.lv3 > .node.current, .lv4 > .node.current, .lv5 > .node.current { background: color-mix(in srgb, var(--c) 14%, transparent); }
@keyframes ring { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--c) 55%, transparent); } 70% { box-shadow: 0 0 0 9px transparent; } 100% { box-shadow: 0 0 0 0 transparent; } }
.searching .node { opacity: .3; }
.searching .node.match, .searching .node.path { opacity: 1; }
.node.match .t { background: var(--hit); border-radius: 3px; box-shadow: 0 0 0 2px var(--hit); }
.lv1 > .node.match .t, .lv0 > .node.match .t { color: var(--fg); }
.hint { font-size: 12px; color: var(--muted); margin: -8px 0 0; }

/* 详情面板 */
.viewer {
  position: fixed; z-index: 30; top: 0; right: 0; bottom: 0; width: min(460px, 100%);
  padding: calc(16px + env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) 18px;
  background: var(--surface); border-left: 1px solid var(--line); box-shadow: -18px 0 40px var(--shadow);
  display: flex; flex-direction: column; gap: 10px; transform: translateX(105%); transition: transform .38s var(--ease); visibility: hidden;
}
.viewer.open { transform: none; visibility: visible; }
.v-head { display: flex; align-items: flex-start; gap: 10px; }
.crumbs { flex: 1; min-width: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
.crumbs span + span::before { content: " / "; opacity: .6; }
.vbtn.icon { width: 32px; height: 32px; padding: 0; flex: none; }
.stage { flex: 1; min-height: 0; border-radius: 12px; background: var(--sunk); border: 1px solid var(--line); display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; touch-action: none; cursor: zoom-in; }
.stage.zoomed { cursor: grab; }
.stage.panning { cursor: grabbing; }
.stage img { max-width: 100%; max-height: 100%; object-fit: contain; display: block; transform-origin: 0 0; will-change: transform; user-select: none; -webkit-user-drag: none; }
.stage img.ease { transition: transform .55s var(--ease); }
.stage img.swap { animation: swap .42s var(--ease) both; }
@keyframes swap { from { opacity: 0; } to { opacity: 1; } }
.stage .prog { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--c, var(--c2)); width: 0; }
.stage .prog.run { animation: prog var(--dur, 3600ms) linear forwards; }
@keyframes prog { to { width: 100%; } }
.zoombar { position: absolute; right: 8px; top: 8px; display: flex; gap: 4px; }
.zoombar .vbtn { padding: 2px 9px; font-size: 12px; background: color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter: blur(6px); }
.zoombar .lvl { font-family: var(--font-mono); font-size: 11px; color: var(--muted); align-self: center; padding: 0 4px; font-variant-numeric: tabular-nums; }
.strip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.strip button { flex: none; width: 44px; height: 54px; border-radius: 6px; overflow: hidden; border: 1.5px solid var(--line); padding: 0; background: var(--sunk); cursor: pointer; opacity: .7; transition: opacity .2s, border-color .2s, transform .2s var(--ease); }
.strip button img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
.strip button[aria-current="true"] { border-color: var(--c, var(--c2)); opacity: 1; transform: translateY(-2px); }
.v-cap { font-size: 12px; color: var(--muted); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.v-cap a { color: inherit; }
.v-title { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.35; }
.v-title .bs { display: inline-flex; gap: 4px; margin-left: 6px; vertical-align: 2px; }
.v-detail { margin: 0; color: var(--muted); font-size: 13px; }
.v-nav { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.v-nav .count { margin-left: auto; font-family: var(--font-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kind { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; white-space: nowrap; }
.scrim { position: fixed; inset: 0; z-index: 29; background: rgba(10, 14, 17, .35); opacity: 0; pointer-events: none; transition: opacity .3s; }
.scrim.on { opacity: 1; pointer-events: auto; }
.extra { display: flex; flex-direction: column; gap: 10px; }
.extra h2 { font-family: var(--font-display); font-size: 20px; margin: 0; text-wrap: balance; }
.extra .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.extra table { border-collapse: collapse; width: 100%; min-width: 620px; font-size: 13px; }
.extra th, .extra td { text-align: left; padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
.extra tr:last-child td { border-bottom: 0; }
.extra th { font-size: 12px; color: var(--muted); font-weight: 500; }
footer { font-size: 12px; color: var(--muted); max-width: 82ch; }
footer code { font-family: var(--font-mono); font-size: 11.5px; }
@media (max-width: 640px) {
  .tree { padding: 20px 28px 20px 14px; }
  .canvas { max-height: 74vh; }
  .viewer { top: auto; left: 0; width: 100%; height: 88vh; border-left: 0; border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; transform: translateY(105%);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-shadow: 0 -18px 40px var(--shadow); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="heading"></h1>
    <p class="lede" id="lede"></p>
  </header>
  <div class="toolbar">
    <div class="group" id="focus"><span class="lab">看哪一支</span><button class="chip" aria-pressed="true" data-k="all" id="f-all">全部</button></div>
    <div class="group">
      <button class="btn" id="expand">全部展开</button>
      <button class="btn" id="collapse">只看概要</button>
      <button class="btn" id="tour">▶ 自动导览</button>
      <input id="q" type="search" placeholder="搜索节点" aria-label="搜索节点">
    </div>
  </div>
  <div class="legend" id="legend" aria-label="状态图例"></div>
  <div class="canvas" id="canvas" tabindex="0" aria-label="脑图画布，可拖动或滚动查看"><div class="tree" id="tree"></div></div>
  <p class="hint" id="hint">点节点展开 / 收起；点缩略图看大图。大图里 <span class="k">←</span> <span class="k">→</span> 切换场景，滚轮或双击放大细节、拖动平移；带 <span class="k">GIF</span> 角标的是动图。</p>
  <div class="extra" id="extra"></div>
  <footer id="footer"></footer>
</div>

<div class="scrim" id="scrim"></div>
<aside class="viewer" id="viewer" aria-label="节点大图" aria-hidden="true">
  <div class="v-head"><div class="crumbs" id="vcrumbs"></div><button class="vbtn icon" id="vclose" aria-label="关闭大图">✕</button></div>
  <div class="stage" id="vstage">
    <img id="vimg" alt="" draggable="false">
    <div class="zoombar">
      <span class="lvl" id="vlvl">100%</span>
      <button class="vbtn" id="zout" aria-label="缩小">−</button>
      <button class="vbtn" id="zin" aria-label="放大">＋</button>
      <button class="vbtn" id="zdetail" hidden>细节</button>
      <button class="vbtn" id="zreset">复位</button>
    </div>
    <i class="prog" id="vprog"></i>
  </div>
  <div class="strip" id="vstrip" aria-label="同一分支的场景截图"></div>
  <div class="v-cap" id="vcap"></div>
  <h3 class="v-title" id="vtitle"></h3>
  <p class="v-detail" id="vdetail"></p>
  <div class="v-nav">
    <button class="vbtn" id="vprev">← 上一个</button>
    <button class="vbtn" id="vplay" aria-pressed="false">▶ 播放</button>
    <button class="vbtn" id="vnext">下一个 →</button>
    <span class="count" id="vcount"></span>
  </div>
</aside>

<script>

  }
  function build(n, lv, parent, idx) {
